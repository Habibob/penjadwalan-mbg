<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengambilan MBG Per Kelas</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
    /* ===== COLOR VARIABLES ===== */
:root {
    --primary: #1957bd;
    --warning: #fa0a22;
    --success: #1bc440;
    --accent: #ffc107;
    --dark: #1a1a1a;
    --light: #f5f5f5;
    --gray: #6c757d;
    --border: #e0e0e0;
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.15);
}

/* ===== RESET & BASE STYLES ===== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--light);
    color: var(--dark);
    line-height: 1.6;
}

/* ===== HEADER ===== */
.header {
    background: linear-gradient(135deg, var(--primary) 0%, #1445a0 100%);
    color: white;
    padding: 1.5rem 0;
    box-shadow: var(--shadow-lg);
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo h1 {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: 0.5px;
}

.subtitle {
    font-size: 0.9rem;
    opacity: 0.9;
    margin-top: 0.25rem;
}

.header-actions {
    display: flex;
    gap: 1rem;
}

.btn-add-schedule {
    background-color: var(--accent);
    color: var(--dark);
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 0.95rem;
}

.btn-add-schedule:hover {
    background-color: #d4a800;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    filter: brightness(0.85);
}

/* ===== MAIN CONTENT ===== */
.main-content {
    max-width: 1200px;
    margin: 0 auto;
    padding: 2rem;
}

/* ===== STATISTICS ===== */
.statistics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1.5rem;
    margin-bottom: 2rem;
}

.stat-card {
    background: white;
    padding: 1.5rem;
    border-radius: 12px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 1.5rem;
    transition: all 0.3s ease;
    border-left: 4px solid var(--primary);
}

.stat-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
}

.stat-icon {
    font-size: 2.5rem;
}

.stat-info h4 {
    color: var(--gray);
    font-size: 0.9rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 0.5rem;
}

.stat-info p {
    font-size: 2rem;
    font-weight: 700;
    color: var(--primary);
}

/* ===== CLASS SECTION ===== */
.class-section {
    background: white;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: var(--shadow);
}

.class-section h2 {
    color: var(--primary);
    margin-bottom: 1.5rem;
    font-size: 1.5rem;
}

.class-list {
    display: grid;
    gap: 1rem;
}

.class-card {
    background: white;
    border: 1px solid var(--border);
    border-left: 4px solid var(--primary);
    border-radius: 8px;
    padding: 1.5rem;
    transition: all 0.3s ease;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.class-card:hover {
    box-shadow: var(--shadow-lg);
    transform: translateX(4px);
}

.class-card.taken {
    border-left-color: var(--success);
    background-color: #f0fdf4;
}

.class-card.not-taken {
    border-left-color: var(--warning);
    background-color: #fff5f5;
}

.class-info {
    flex: 1;
}

.class-name {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--dark);
    margin-bottom: 0.5rem;
}

.class-meta {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    font-size: 0.9rem;
    color: var(--gray);
}

.class-meta-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.class-status {
    display: inline-block;
    padding: 0.4rem 0.8rem;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    margin-top: 0.5rem;
}

.status-taken {
    background-color: #e8f5e9;
    color: var(--success);
}

.status-not-taken {
    background-color: #fff3e0;
    color: #ff6f00;
}

.class-actions {
    display: flex;
    gap: 0.75rem;
    margin-left: 1rem;
}

.btn-checkbox {
    padding: 0.75rem 1.5rem;
    border: 2px solid var(--primary);
    background-color: white;
    color: var(--primary);
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 0.95rem;
}

.btn-checkbox:hover {
    background-color: var(--primary);
    color: white;
    transform: translateY(-2px);
}

.btn-checkbox.checked {
    background-color: var(--success);
    color: white;
    border-color: var(--success);
}

.btn-edit {
    background-color: var(--primary);
    color: white;
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 0.95rem;
}

.btn-edit:hover {
    background-color: #1445a0;
    transform: translateY(-2px);
}

.btn-delete {
    background-color: var(--warning);
    color: white;
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 0.95rem;
}

.btn-delete:hover {
    background-color: #d90820;
    transform: translateY(-2px);
}

.empty-state {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--gray);
    font-size: 1.1rem;
}

/* ===== MODAL ===== */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    animation: fadeIn 0.3s ease;
}

.modal.active {
    display: flex;
    justify-content: center;
    align-items: center;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

.modal-content {
    background: white;
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
    max-width: 600px;
    width: 90%;
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
}

@keyframes slideUp {
    from {
        transform: translateY(20px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem;
    border-bottom: 2px solid var(--primary);
}

.modal-header h2 {
    color: var(--primary);
    font-size: 1.3rem;
}

.btn-close {
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: var(--gray);
    transition: color 0.3s ease;
}

.btn-close:hover {
    color: var(--dark);
}

/* ===== FORM ===== */
form {
    padding: 1.5rem;
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
}

.form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 0.5rem;
    color: var(--dark);
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 0.95rem;
    font-family: inherit;
    transition: all 0.3s ease;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(25, 87, 189, 0.1);
}

.form-group textarea {
    resize: vertical;
}

/* ===== BUTTONS ===== */
.form-actions {
    display: flex;
    gap: 1rem;
    justify-content: flex-end;
    margin-top: 2rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
}

.btn-save,
.btn-cancel {
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 0.95rem;
}

.btn-save {
    background-color: var(--success);
    color: white;
}

.btn-save:hover {
    background-color: #15a835;
    transform: translateY(-2px);
}

.btn-cancel {
    background-color: var(--gray);
    color: white;
}

.btn-cancel:hover {
    background-color: #5a6268;
}

/* ===== LOADING ===== */
.loading {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.3);
    z-index: 2000;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 1rem;
}

.loading.active {
    display: flex;
}

.spinner {
    width: 50px;
    height: 50px;
    border: 4px solid rgba(25, 87, 189, 0.2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.loading p {
    color: white;
    font-weight: 600;
}

/* ===== TOAST NOTIFICATION ===== */
.toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    padding: 1rem 1.5rem;
    background-color: var(--success);
    color: white;
    border-radius: 8px;
    box-shadow: var(--shadow-lg);
    display: none;
    animation: slideInRight 0.3s ease;
    z-index: 1500;
    max-width: 300px;
}

.toast.active {
    display: block;
}

.toast.success {
    background-color: var(--success);
}

.toast.error {
    background-color: var(--warning);
}

.toast.info {
    background-color: var(--primary);
}

@keyframes slideInRight {
    from {
        transform: translateX(400px);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
    .header-container {
        flex-direction: column;
        gap: 1rem;
    }

    .header-actions {
        width: 100%;
        flex-direction: column;
    }

    .btn-add-schedule {
        width: 100%;
    }

    .main-content {
        padding: 1rem;
    }

    .statistics {
        grid-template-columns: 1fr;
    }

    .form-row {
        grid-template-columns: 1fr;
    }

    .class-card {
        flex-direction: column;
        align-items: flex-start;
    }

    .class-actions {
        margin-left: 0;
        margin-top: 1rem;
        width: 100%;
    }

    .btn-checkbox,
    .btn-edit,
    .btn-delete {
        flex: 1;
    }

    .modal-content {
        width: 95%;
        max-height: 95vh;
    }

    .toast {
        right: 1rem;
        left: 1rem;
        max-width: none;
    }
}

@media (max-width: 480px) {
    .logo h1 {
        font-size: 1.3rem;
    }

    .class-card {
        flex-direction: column;
        align-items: flex-start;
    }

    .class-actions {
        flex-direction: column;
        width: 100%;
    }

    .btn-checkbox,
    .btn-edit,
    .btn-delete {
        width: 100%;
    }

    .form-actions {
        flex-direction: column;
    }

    .btn-save,
    .btn-cancel {
        width: 100%;
    }
}

</style>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <h1>📚 Pengambilan MBG Per Kelas</h1>
                <p class="subtitle">Sistem Manajemen Pengambilan MBG</p>
            </div>
            <div class="header-actions">
                <button class="btn-add-schedule" onclick="openAddModal()">+ Tambah Kelas</button>
                <button class="btn-add-schedule" onclick="exportToSpreadsheet()" style="background-color: #4CAF50;">📊 Export ke Spreadsheet</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Statistics -->
        <section class="statistics">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-info">
                    <h4>Total Kelas</h4>
                    <p id="totalClasses">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✅</div>
                <div class="stat-info">
                    <h4>Sudah Mengambil</h4>
                    <p id="takenCount">0</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⏳</div>
                <div class="stat-info">
                    <h4>Belum Mengambil</h4>
                    <p id="notTakenCount">0</p>
                </div>
            </div>
        </section>

        <!-- Class List -->
        <section class="class-section">
            <h2>Daftar Kelas</h2>
            <div class="class-list" id="classList">
                <p class="empty-state">Belum ada kelas. Tambahkan kelas baru untuk memulai.</p>
            </div>
        </section>
    </main>

    <!-- Modal Add/Edit Class -->
    <div class="modal" id="classModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Tambah Kelas Baru</h2>
                <button class="btn-close" onclick="closeModal()">✕</button>
            </div>
            <form id="classForm" onsubmit="saveClass(event)">
                <div class="form-group">
                    <label for="className">Nama Kelas *</label>
                    <input type="text" id="className" required placeholder="Contoh: Kelas 1A">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="classLevel">Tingkat Kelas *</label>
                        <select id="classLevel" required>
                            <option value="">Pilih Tingkat</option>
                            <option value="1">Kelas 1</option>
                            <option value="2">Kelas 2</option>
                            <option value="3">Kelas 3</option>
                            <option value="4">Kelas 4</option>
                            <option value="5">Kelas 5</option>
                            <option value="6">Kelas 6</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="classTeacher">Wali Kelas *</label>
                        <input type="text" id="classTeacher" required placeholder="Nama wali kelas">
                    </div>
                </div>

                <div class="form-group">
                    <label for="classStudentCount">Jumlah Siswa *</label>
                    <input type="number" id="classStudentCount" required min="1" placeholder="Contoh: 30">
                </div>

                <div class="form-group">
                    <label for="classNotes">Catatan</label>
                    <textarea id="classNotes" placeholder="Catatan tambahan..." rows="3"></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Batal</button>
                    <button type="submit" class="btn-save">Simpan Kelas</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading Indicator -->
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Memproses...</p>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script>
        // ===== DATA STORAGE =====
let classes = JSON.parse(localStorage.getItem('mbgClasses')) || [];
let currentEditingId = null;

// ===== INITIALIZATION =====
document.addEventListener('DOMContentLoaded', function() {
    initializeApp();
});

function initializeApp() {
    renderClassList();
    updateStatistics();
}

// ===== MODAL FUNCTIONS =====
function openAddModal() {
    currentEditingId = null;
    document.getElementById('modalTitle').textContent = 'Tambah Kelas Baru';
    document.getElementById('classForm').reset();
    document.getElementById('classModal').classList.add('active');
}

function closeModal() {
    document.getElementById('classModal').classList.remove('active');
    currentEditingId = null;
}

// ===== SAVE CLASS =====
function saveClass(event) {
    event.preventDefault();
    
    showLoading(true);
    
    setTimeout(() => {
        const classData = {
            id: currentEditingId || Date.now(),
            name: document.getElementById('className').value,
            level: document.getElementById('classLevel').value,
            teacher: document.getElementById('classTeacher').value,
            studentCount: parseInt(document.getElementById('classStudentCount').value),
            notes: document.getElementById('classNotes').value,
            taken: currentEditingId ? 
                classes.find(c => c.id === currentEditingId).taken : 
                false,
            createdAt: currentEditingId ? 
                classes.find(c => c.id === currentEditingId).createdAt : 
                new Date().toISOString()
        };

        if (currentEditingId) {
            const index = classes.findIndex(c => c.id === currentEditingId);
            classes[index] = classData;
            showToast('Kelas berhasil diperbarui!', 'success');
        } else {
            classes.push(classData);
            showToast('Kelas berhasil ditambahkan!', 'success');
        }

        localStorage.setItem('mbgClasses', JSON.stringify(classes));
        closeModal();
        renderClassList();
        updateStatistics();
        showLoading(false);
    }, 500);
}

// ===== EDIT CLASS =====
function editClass(classId) {
    const classData = classes.find(c => c.id === classId);
    if (!classData) return;

    currentEditingId = classId;
    document.getElementById('modalTitle').textContent = 'Edit Kelas';
    document.getElementById('className').value = classData.name;
    document.getElementById('classLevel').value = classData.level;
    document.getElementById('classTeacher').value = classData.teacher;
    document.getElementById('classStudentCount').value = classData.studentCount;
    document.getElementById('classNotes').value = classData.notes;
    
    document.getElementById('classModal').classList.add('active');
}

// ===== DELETE CLASS =====
function deleteClass(classId) {
    if (confirm('Apakah Anda yakin ingin menghapus kelas ini?')) {
        showLoading(true);
        
        setTimeout(() => {
            classes = classes.filter(c => c.id !== classId);
            localStorage.setItem('mbgClasses', JSON.stringify(classes));
            renderClassList();
            updateStatistics();
            showToast('Kelas berhasil dihapus!', 'success');
            showLoading(false);
        }, 500);
    }
}

// ===== TOGGLE TAKEN STATUS =====
function toggleTaken(classId) {
    const classData = classes.find(c => c.id === classId);
    if (!classData) return;

    classData.taken = !classData.taken;
    localStorage.setItem('mbgClasses', JSON.stringify(classes));
    renderClassList();
    updateStatistics();
    
    const status = classData.taken ? 'Sudah mengambil' : 'Belum mengambil';
    showToast(`${classData.name} - ${status}`, 'success');
}

// ===== RENDER CLASS LIST =====
function renderClassList() {
    const listContainer = document.getElementById('classList');
    
    if (classes.length === 0) {
        listContainer.innerHTML = '<p class="empty-state">Belum ada kelas. Tambahkan kelas baru untuk memulai.</p>';
        return;
    }
    
    // Sort classes by level
    const sortedClasses = [...classes].sort((a, b) => {
        return parseInt(a.level) - parseInt(b.level);
    });
    
    let html = '';
    sortedClasses.forEach(classData => {
        const statusClass = classData.taken ? 'taken' : 'not-taken';
        const statusText = classData.taken ? 'Sudah Mengambil' : 'Belum Mengambil';
        const statusBadgeClass = classData.taken ? 'status-taken' : 'status-not-taken';
        const buttonClass = classData.taken ? 'checked' : '';
        const buttonText = classData.taken ? '✓ Sudah Mengambil' : '☐ Belum Mengambil';
        
        html += `
            <div class="class-card ${statusClass}">
                <div class="class-info">
                    <div class="class-name">Kelas ${classData.level}${classData.name.replace(/^Kelas \d+/, '').trim()}</div>
                    <div class="class-meta">
                        <div class="class-meta-item">👨‍🏫 ${classData.teacher}</div>
                        <div class="class-meta-item">👥 ${classData.studentCount} siswa</div>
                    </div>
                    ${classData.notes ? `<div class="class-meta" style="margin-top: 0.5rem; color: var(--dark);"><div class="class-meta-item">📝 ${classData.notes}</div></div>` : ''}
                    <div style="margin-top: 0.75rem;">
                        <span class="class-status ${statusBadgeClass}">${statusText}</span>
                    </div>
                </div>
                <div class="class-actions">
                    <button class="btn-checkbox ${buttonClass}" onclick="toggleTaken(${classData.id})">${buttonText}</button>
                    <button class="btn-edit" onclick="editClass(${classData.id})">✏️ Edit</button>
                    <button class="btn-delete" onclick="deleteClass(${classData.id})">🗑️ Hapus</button>
                </div>
            </div>
        `;
    });
    
    listContainer.innerHTML = html;
}

// ===== UPDATE STATISTICS =====
function updateStatistics() {
    const total = classes.length;
    const taken = classes.filter(c => c.taken).length;
    const notTaken = total - taken;
    
    document.getElementById('totalClasses').textContent = total;
    document.getElementById('takenCount').textContent = taken;
    document.getElementById('notTakenCount').textContent = notTaken;
}

// ===== LOADING & TOAST =====
function showLoading(show) {
    const loading = document.getElementById('loading');
    if (show) {
        loading.classList.add('active');
    } else {
        loading.classList.remove('active');
    }
}

function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = `toast active ${type}`;
    
    setTimeout(() => {
        toast.classList.remove('active');
    }, 3000);
}

// ===== SAMPLE DATA (Optional) =====
function addSampleData() {
    const sampleClasses = [
        {
            id: 1,
            name: 'Kelas 1A',

// ===== EXPORT TO SPREADSHEET =====
function exportToSpreadsheet() {
    if (classes.length === 0) {
        showToast('Tidak ada data kelas untuk diekspor!', 'error');
        return;
    }
    
    showLoading(true);
    
    setTimeout(() => {
        // Create CSV content
        let csv = 'No,Tingkat Kelas,Nama Kelas,Wali Kelas,Jumlah Siswa,Status Pengambilan,Catatan,Tanggal Dibuat\n';
        
        classes.forEach((classData, index) => {
            const status = classData.taken ? 'Sudah Mengambil' : 'Belum Mengambil';
            const createdDate = new Date(classData.createdAt).toLocaleDateString('id-ID');
            const notes = classData.notes ? classData.notes.replace(/"/g, '""') : '';
            
            csv += `${index + 1},"Kelas ${classData.level}","${classData.name}","${classData.teacher}",${classData.studentCount},"${status}","${notes}","${createdDate}"\n`;
        });
        
        // Create blob and download
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        
        link.setAttribute('href', url);
        link.setAttribute('download', `pengambilan-mbg-${new Date().toISOString().split('T')[0]}.csv`);
        link.style.visibility = 'hidden';
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        showToast('Data berhasil diekspor ke CSV!', 'success');
        showLoading(false);
    }, 500);
}
